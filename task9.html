<!DOCTYPE html>
<html lang="en">

<head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>E-Commerce</title>
        <link rel="stylesheet" href="task9.css">
</head>

<body>

        <header>
                <h1>E-Commerce Product Dashboard </h1>

                <div class="cart-box" onclick="toggleCart()">
                        Cart items:
                        <span id="cartCount">0</span>
                </div>
        </header>

        <!-- SEARCH + CATEGORY -->
        <div class="controls">

                <input type="text" id="search" placeholder="Search Products...">

                <select id="category">
                        <option value="all">All Categories</option>
                        <option value="men's clothing">Men's Clothing</option>
                        <option value="women's clothing">Women's Clothing</option>
                        <option value="electronics">Electronics</option>
                        <option value="jewelery">Jewelry</option>
                </select>

        </div>

        <!-- STATUS -->
        <h2 id="status">Loading Products...</h2>

        <!-- STATS -->
        <section id="stats"></section>

        <!-- PRODUCTS -->
        <section id="products"></section>

        <div id="cartPanel" class="cart-panel hidden">
                <h2>Cart Items</h2>
                <div id="cartItems"></div>
        </div>

        <script src="task9.js"></script>

</body>

</html>
